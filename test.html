<!DOCTYPE html>
<html lang="de" class="dark">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Worker API Monitor</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
    darkMode:"class"
}
</script>

<style>
body{
    font-family:Inter,system-ui,sans-serif;
}

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#334155;
    border-radius:10px;
}
</style>

</head>


<body class="bg-slate-950 text-slate-100 min-h-screen p-6">


<div class="max-w-7xl mx-auto space-y-8">



<!-- HEADER -->

<header class="flex flex-col md:flex-row justify-between gap-4">

<div>

<h1 class="text-3xl font-bold">
⚡ Worker API Monitor
</h1>

<p class="text-slate-400 mt-2">
Substack Proxy Performance & Rate Limit Testing
</p>

</div>


<div id="workerStatus"
class="px-4 py-2 rounded-xl bg-slate-900 border border-slate-800">

🟡 Waiting

</div>


</header>






<!-- SETTINGS -->

<section class="bg-slate-900 border border-slate-800 rounded-2xl p-6">


<h2 class="font-bold text-xl mb-5">
Test Configuration
</h2>


<div class="grid md:grid-cols-4 gap-4">


<div>
<label class="text-sm text-slate-400">
Substack Handle
</label>

<input id="handle"
value="unknownlegends"
class="mt-2 w-full bg-slate-950 border border-slate-700 rounded-xl p-3">
</div>



<div>

<label class="text-sm text-slate-400">
Requests
</label>

<input id="requests"
type="number"
value="50"
class="mt-2 w-full bg-slate-950 border border-slate-700 rounded-xl p-3">

</div>




<div>

<label class="text-sm text-slate-400">
Post Limit
</label>

<input id="limit"
type="number"
value="5"
class="mt-2 w-full bg-slate-950 border border-slate-700 rounded-xl p-3">

</div>





<div>

<label class="text-sm text-slate-400">
Delay ms
</label>

<input id="delay"
type="number"
value="300"
class="mt-2 w-full bg-slate-950 border border-slate-700 rounded-xl p-3">

</div>


</div>



<div class="flex gap-3 mt-6">

<button onclick="startTest()"
class="bg-orange-600 hover:bg-orange-500 px-6 py-3 rounded-xl font-bold">

Start Test

</button>


<button onclick="stopTest()"
class="bg-red-600 hover:bg-red-500 px-6 py-3 rounded-xl font-bold">

Stop

</button>


<button onclick="exportData()"
class="bg-slate-700 hover:bg-slate-600 px-6 py-3 rounded-xl">

Export JSON

</button>


</div>


</section>








<!-- STATS -->

<section class="grid md:grid-cols-6 gap-4">


<div class="card">
<span>Total</span>
<b id="total">0</b>
</div>


<div class="card">
<span class="text-green-400">
200 OK
</span>
<b id="success">0</b>
</div>


<div class="card">
<span class="text-orange-400">
429 Limit
</span>
<b id="rate429">0</b>
</div>



<div class="card">
<span class="text-red-400">
Errors
</span>
<b id="errors">0</b>
</div>



<div class="card">
<span>
Error %
</span>
<b id="errorRate">
0%
</b>
</div>



<div class="card">
<span>
Avg ms
</span>

<b id="avg">
0
</b>

</div>


</section>






<!-- STATUS BAR -->

<section class="bg-slate-900 border border-slate-800 rounded-2xl p-6">


<h2 class="font-bold mb-4">
HTTP Status Overview
</h2>


<div id="statusBars"
class="space-y-3">

</div>


</section>






<!-- PERFORMANCE -->


<section class="grid md:grid-cols-3 gap-5">


<div class="bg-slate-900 border border-slate-800 rounded-xl p-5">

<div class="text-slate-400">
Fastest Request
</div>

<div id="fastest"
class="text-3xl font-bold">
0ms
</div>

</div>



<div class="bg-slate-900 border border-slate-800 rounded-xl p-5">

<div class="text-slate-400">
Slowest Request
</div>

<div id="slowest"
class="text-3xl font-bold">
0ms
</div>

</div>




<div class="bg-slate-900 border border-slate-800 rounded-xl p-5">

<div class="text-slate-400">
Requests/min
</div>

<div id="rpm"
class="text-3xl font-bold">
0
</div>

</div>



</section>






<!-- LOG -->


<section class="bg-slate-900 border border-slate-800 rounded-2xl p-6">


<div class="flex justify-between mb-4">

<h2 class="font-bold text-xl">
Request Logs
</h2>


<button onclick="clearLogs()"
class="text-sm text-slate-400 hover:text-white">

Clear

</button>


</div>


<div id="logs"
class="space-y-2 max-h-[500px] overflow-auto font-mono text-sm">

</div>


</section>



</div>







<script>


/*
DEIN WORKER HASH
*/

const WORKER_HASH =
"aHR0cHM6Ly9zdXBlci1iYW5kLTliMzMub2xpdmVyaW8tYWxlc3NhbmRyby53b3JrZXJzLmRldi8=";



function workerURL(){

return atob(WORKER_HASH);

}




const stats={

total:0,
success:0,
rate429:0,
errors:0,
times:[],
codes:{}

};


let running=false;


let history=[];




function reset(){


stats.total=0;
stats.success=0;
stats.rate429=0;
stats.errors=0;
stats.times=[];
stats.codes={};

history=[];

update();


}




async function startTest(){


reset();

running=true;


document.getElementById("workerStatus").innerHTML=
"🟢 Running";


let handle =
document.getElementById("handle").value;


let amount =
Number(document.getElementById("requests").value);


let limit =
Number(document.getElementById("limit").value);


let delay =
Number(document.getElementById("delay").value);




let target=
`https://${handle}.substack.com/api/v1/posts?sort=new&limit=${limit}`;



for(let i=1;i<=amount;i++){


if(!running)
break;


await request(target,i);



await sleep(delay);


}



running=false;


document.getElementById("workerStatus").innerHTML=
"✅ Finished";



}





async function request(target,index){


let base=workerURL();


if(!base.endsWith("/"))
base+="/";



let url=
base+encodeURIComponent(
btoa(target)
);



let start=performance.now();



try{


let res=await fetch(url);


let ms=Math.round(
performance.now()-start
);


stats.total++;

stats.times.push(ms);


stats.codes[res.status]=
(stats.codes[res.status]||0)+1;



if(res.status===200)
stats.success++;


else if(res.status===429)
stats.rate429++;


else
stats.errors++;




history.push({

time:new Date().toLocaleTimeString(),
status:res.status,
ms

});



addLog(
index,
res.status,
ms
);



}


catch(e){


stats.total++;
stats.errors++;


addLog(
index,
"NETWORK",
0
);


}


update();


}








function update(){


document.getElementById("total").innerHTML=
stats.total;


document.getElementById("success").innerHTML=
stats.success;


document.getElementById("rate429").innerHTML=
stats.rate429;


document.getElementById("errors").innerHTML=
stats.errors;



let rate=
stats.total?
((stats.errors+stats.rate429)/stats.total*100)
.toFixed(1)
:0;



document.getElementById("errorRate")
.innerHTML=
rate+"%";



let avg=
stats.times.length?
Math.round(
stats.times.reduce((a,b)=>a+b,0)
/stats.times.length)
:0;



document.getElementById("avg")
.innerHTML=
avg+"ms";



document.getElementById("fastest")
.innerHTML=
stats.times.length?
Math.min(...stats.times)+"ms"
:"0ms";


document.getElementById("slowest")
.innerHTML=
stats.times.length?
Math.max(...stats.times)+"ms"
:"0ms";


renderBars();


}





function renderBars(){


let html="";


Object.keys(stats.codes)
.sort()
.forEach(code=>{


let count=
stats.codes[code];


let percent=
(count/stats.total*100).toFixed(1);



html+=`

<div>

<div class="flex justify-between text-sm">

<span>${code}</span>

<span>${count}</span>

</div>


<div class="h-3 bg-slate-800 rounded">

<div class="h-full bg-orange-500 rounded"
style="width:${percent}%">

</div>

</div>


</div>


`;

});


document.getElementById("statusBars")
.innerHTML=html;


}







function addLog(i,status,ms){


let color=
status==200?
"green":
status==429?
"orange":
"red";



let div=document.createElement("div");


div.className=
"bg-slate-950 border border-slate-800 rounded-lg p-3";


div.innerHTML=

`

<span class="text-slate-500">
#${i}
</span>

<span class="text-${color}-400 font-bold">
${status}
</span>

<span>
${ms}ms
</span>

<span class="text-slate-500">
${new Date().toLocaleTimeString()}
</span>

`;



document.getElementById("logs")
.prepend(div);


}






function stopTest(){

running=false;

document.getElementById("workerStatus")
.innerHTML=
"⏹ Stopped";

}




function clearLogs(){

document.getElementById("logs")
.innerHTML="";

}




function exportData(){


let blob=new Blob(
[
JSON.stringify(
{
stats,
history
},
null,
2)
],
{
type:"application/json"
}
);


let a=document.createElement("a");

a.href=
URL.createObjectURL(blob);


a.download=
"worker-test-result.json";


a.click();


}





function sleep(ms){

return new Promise(
r=>setTimeout(r,ms)
);

}



</script>





<style>

.card{

background:#0f172a;
border:1px solid #1e293b;
padding:20px;
border-radius:16px;
display:flex;
flex-direction:column;
gap:10px;

}

.card span{

color:#94a3b8;
font-size:14px;

}


.card b{

font-size:30px;

}

</style>


</body>
</html>
